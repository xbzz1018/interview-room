appId: top.techspar.desktop
productName: 面试练习室
artifactName: Interview-Room-${version}-${os}-${arch}.${ext}
asar: true
npmRebuild: false
directories:
  output: ../../dist/desktop
  buildResources: build
files:
  - dist/**/*
  - package.json
  - "!node_modules/**/*"
extraResources:
  - from: build/icon.png
    to: brand/app-icon.png
  - from: ../../docs/third-party/lucide.txt
    to: licenses/lucide.txt
  - from: ../../LICENSE
    to: licenses/project-AGPL-3.0.txt
  - from: ../../NOTICE.md
    to: licenses/NOTICE.md
  - from: ../../frontend/src/resume/LICENSE
    to: licenses/resume-module-LICENSE.txt
  - from: ../../docs/third-party/meetily.md
    to: licenses/meetily.md
  - from: resources/backend
    to: backend
    filter:
      - "**/*"
  - from: ../../frontend/dist
    to: web
    filter:
      - "**/*"
mac:
  category: public.app-category.education
  icon: build/icon.png
  target:
    - dmg
    - zip
win:
  executableName: TechSpar
  icon: build/icon.ico
  target:
    - nsis
linux:
  icon: build/icon.png
  category: Education
  target:
    - AppImage
    - deb
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
